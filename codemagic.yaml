workflows:
  ios-validation:
    name: iOS · validar y compilar
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Instalar dependencias Flutter
        script: flutter pub get
      - name: Comprobar código
        script: flutter analyze lib/main.dart lib/src test
      - name: Ejecutar pruebas
        script: flutter test
      - name: Compilar para simulador iOS
        script: flutter build ios --simulator --debug
    artifacts:
      - build/ios/iphonesimulator/*.app
      - flutter_drive.log

  ios-testflight:
    name: iOS · TestFlight Coffee Break
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic Coffee Break
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.airsoto.coffeebreak
      vars:
        BUNDLE_ID: com.airsoto.coffeebreak
    scripts:
      - name: Instalar dependencias Flutter
        script: flutter pub get
      - name: Aplicar firma de Coffee Break
        script: |
          xcode-project use-profiles
      - name: Generar IPA firmado
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
